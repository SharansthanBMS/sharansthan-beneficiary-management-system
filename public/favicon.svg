<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Burnt orange to deep red gradients matching the original logo brushstrokes -->
    <linearGradient id="roofGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A52A2A" />
      <stop offset="50%" stop-color="#BE4A3A" />
      <stop offset="100%" stop-color="#D56332" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D56332" />
      <stop offset="100%" stop-color="#A52A2A" />
    </linearGradient>
  </defs>

  <!-- Group with small padding/offset to center the logo perfectly -->
  <g transform="translate(0, 5)">
    <!-- 1. Curved bottom floor base (Deep Red to Burnt Orange) -->
    <path d="M 50,415 C 120,447 250,450 380,427 C 420,420 445,410 450,400 C 445,393 420,407 380,413 C 250,430 120,427 50,415 Z" fill="url(#roofGrad)" />

    <!-- 2. Left Wall Column -->
    <path d="M 126,225 C 126,285 128,345 127,405 C 132,405 134,345 133,225 Z" fill="url(#wallGrad)" />

    <!-- 3. Right Wall Column -->
    <path d="M 382,205 C 378,265 371,335 367,395 C 372,395 379,335 384,205 Z" fill="url(#wallGrad)" />

    <!-- 4. Roof Sweeps -->
    <!-- Left Slope -->
    <path d="M 40,245 C 40,245 110,205 255,95 C 265,90 272,90 270,100 C 255,115 120,235 50,260 C 42,263 38,255 40,245 Z" fill="url(#roofGrad)" />
    <!-- Right Slope -->
    <path d="M 255,95 C 255,95 320,145 410,205 C 418,211 415,219 405,213 C 320,160 265,115 255,95 Z" fill="url(#roofGrad)" />
    <!-- Inner Roof Accent -->
    <path d="M 190,170 C 215,150 240,130 255,115 C 270,130 295,150 320,170" stroke="url(#roofGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" />

    <!-- 5. Calligraphic cursive 'S' -->
    <path d="M 60,315 C 50,315 55,290 90,275 C 130,255 215,210 250,180 C 280,155 295,120 260,120 C 210,120 180,180 200,250 C 215,305 245,365 215,395 C 195,415 165,405 160,375 C 155,345 185,290 210,250 C 240,200 310,180 390,175 C 395,175 398,180 390,180 C 310,185 245,205 215,255 C 190,295 165,350 170,380 C 175,410 205,420 225,400 C 255,370 225,310 210,260 C 195,200 220,130 260,130 C 285,130 275,160 245,187 C 210,217 130,263 92,281 C 68,293 58,315 60,315 Z" fill="#222222" />

    <!-- 6. Stylized flying bird/dove -->
    <!-- Foreground Wing -->
    <path d="M 408,207 C 418,193 436,183 454,187 C 447,201 433,215 417,223 Z" fill="#222222" />
    <!-- Background Wing -->
    <path d="M 422,193 C 431,175 447,173 454,180 C 445,187 433,193 422,193 Z" fill="#222222" />
    <!-- Bird Body, Head, and Beak -->
    <path d="M 410,207 C 414,209 420,211 425,215 C 430,220 435,220 438,215 C 441,210 445,207 448,209 C 447,210 445,213 442,214 C 438,216 435,221 430,221 C 422,221 414,217 410,207 Z" fill="#222222" />
  </g>
</svg>